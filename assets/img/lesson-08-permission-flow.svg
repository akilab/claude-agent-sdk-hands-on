<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 08 permission flow</title>
  <desc id="desc">Diagram showing how Lesson 08 configures a read-only agent with allowed_tools, disallowed_tools, and permission_mode dontAsk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3267b9"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .band { fill: #ffffff; stroke: #d5dfef; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #9cb7dc; stroke-width: 2; }
      .node-ok { fill: #eef8f3; stroke: #338765; stroke-width: 2; }
      .node-stop { fill: #fff1ee; stroke: #c85b45; stroke-width: 2; }
      .node-warn { fill: #fff6e6; stroke: #bf7a18; stroke-width: 2; }
      .edge { fill: none; stroke: #3267b9; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-stop { fill: none; stroke: #c85b45; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #6f86a8; stroke-width: 2; marker-end: url(#arrow); }
      .title { fill: #17233a; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #17233a; font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4c5f79; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #17406f; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect class="band" x="40" y="40" width="1200" height="680" rx="12"/>

  <text class="title" x="70" y="84">Lesson 08: 読み取り専用Agentの権限設計</text>
  <text class="small" x="70" y="112">allowed_toolsだけでは制限にならないため、dontAsk と disallowed_tools を組み合わせます。</text>

  <rect class="node" x="70" y="170" width="210" height="86" rx="8"/>
  <text class="text" x="112" y="204">Agentが</text>
  <text class="text" x="98" y="228">ツール利用を要求</text>

  <rect class="node-stop" x="350" y="110" width="250" height="112" rx="8"/>
  <text class="text" x="392" y="145">disallowed_tools</text>
  <text class="small" x="382" y="172">Edit / Write / Bash</text>
  <text class="small" x="382" y="196">指定ツールは使わせない</text>

  <rect class="node-warn" x="350" y="278" width="250" height="112" rx="8"/>
  <text class="text" x="396" y="312">permission_mode</text>
  <text class="small" x="418" y="340">dontAsk</text>
  <text class="small" x="382" y="364">未承認ツールは質問せず拒否</text>

  <rect class="node-ok" x="690" y="170" width="250" height="112" rx="8"/>
  <text class="text" x="738" y="204">allowed_tools</text>
  <text class="small" x="755" y="232">Read / Glob</text>
  <text class="small" x="726" y="256">この2つだけ自動承認</text>

  <rect class="node-ok" x="1010" y="110" width="190" height="92" rx="8"/>
  <text class="text" x="1060" y="146">実行</text>
  <text class="small" x="1040" y="174">文書を読む</text>

  <rect class="node-stop" x="1010" y="292" width="190" height="92" rx="8"/>
  <text class="text" x="1060" y="328">拒否</text>
  <text class="small" x="1033" y="356">編集やコマンド実行</text>

  <rect class="node" x="170" y="520" width="940" height="112" rx="8"/>
  <text class="text" x="214" y="556">Lesson 08の設定</text>
  <text class="small" x="214" y="586">allowed_tools=["Read", "Glob"]</text>
  <text class="small" x="488" y="586">disallowed_tools=["Edit", "Write", "Bash"]</text>
  <text class="small" x="846" y="586">permission_mode="dontAsk"</text>
  <text class="small" x="214" y="614">結果: Agentは教材ファイルを読めるが、編集・書き込み・コマンド実行へ広がりにくい。</text>

  <path class="edge" d="M 280 213 L 346 166"/>
  <path class="edge-stop" d="M 600 166 C 752 92, 922 94, 1006 146"/>
  <path class="edge" d="M 280 213 L 346 334"/>
  <path class="edge-soft" d="M 600 334 C 770 422, 910 414, 1006 338"/>
  <path class="edge" d="M 600 222 L 686 222"/>
  <path class="edge" d="M 940 222 C 978 210, 990 180, 1006 156"/>

  <text class="label" x="618" y="142">禁止に一致</text>
  <text class="label" x="618" y="366">承認されない</text>
  <text class="label" x="956" y="218">Read / Glob</text>
</svg>
