<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 20 conversation and message persistence sequence</title>
  <desc id="desc">The learner runs the script, ClaudeSDKClient sends a prompt, receives AssistantMessage and ResultMessage, then saves the session plus user and assistant messages to SQLite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1120" height="720" rx="28" fill="#f8fafc"/>
  <rect x="44" y="36" width="1032" height="648" rx="24" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/>

  <text x="74" y="84" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Lesson 20: Claudeとの1回の会話をSQLiteへ保存する</text>
  <text x="74" y="116" font-family="Arial, sans-serif" font-size="15" fill="#475569">ResultMessageからsession_idを受け取り、sessionsに会話、messagesにuser / assistantを保存します。</text>

  <g font-family="Arial, sans-serif">
    <g>
      <rect x="74" y="154" width="172" height="54" rx="10" fill="#0f2f5f"/>
      <text x="160" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">学習者</text>
      <line x1="160" y1="208" x2="160" y2="632" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>

    <g>
      <rect x="286" y="154" width="172" height="54" rx="10" fill="#1d4ed8"/>
      <text x="372" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Lesson 20 script</text>
      <line x1="372" y1="208" x2="372" y2="632" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>

    <g>
      <rect x="498" y="154" width="172" height="54" rx="10" fill="#0369a1"/>
      <text x="584" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ClaudeSDKClient</text>
      <line x1="584" y1="208" x2="584" y2="632" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>

    <g>
      <rect x="710" y="154" width="172" height="54" rx="10" fill="#334155"/>
      <text x="796" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">shared.database</text>
      <line x1="796" y1="208" x2="796" y2="632" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>

    <g>
      <rect x="922" y="154" width="118" height="54" rx="10" fill="#0f766e"/>
      <text x="981" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SQLite</text>
      <line x1="981" y1="208" x2="981" y2="632" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#0f172a">
    <line x1="170" y1="252" x2="358" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="264" y="241" text-anchor="middle">スクリプトを実行</text>

    <line x1="382" y1="306" x2="570" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="476" y="295" text-anchor="middle">client.query(PROMPT)</text>

    <line x1="570" y1="360" x2="382" y2="360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="476" y="349" text-anchor="middle">AssistantMessage</text>

    <line x1="570" y1="414" x2="382" y2="414" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="476" y="403" text-anchor="middle">ResultMessage(session_id)</text>

    <line x1="382" y1="468" x2="782" y2="468" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="582" y="457" text-anchor="middle">session_recordと2件のmessageを渡す</text>

    <line x1="806" y1="522" x2="968" y2="522" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="887" y="511" text-anchor="middle">sessionsへ保存</text>

    <line x1="806" y1="576" x2="968" y2="576" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="887" y="565" text-anchor="middle">messagesへ保存</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="286" y="596" width="344" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="458" y="623" text-anchor="middle" fill="#1e3a8a">保存する本文: user prompt / assistant text</text>

    <rect x="706" y="604" width="330" height="44" rx="10" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="871" y="631" text-anchor="middle" fill="#115e59">DB Browserではmessagesテーブルで確認</text>
  </g>
</svg>
