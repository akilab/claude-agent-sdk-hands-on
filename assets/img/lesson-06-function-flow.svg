<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 06 function call flow</title>
  <desc id="desc">main calls run_agent through asyncio. run_agent builds options and prompt, calls query, branches by message type, records output, and saves the result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3267b9"/>
    </marker>
    <style>
      .bg { fill: #f8fbff; }
      .lane { fill: #ffffff; stroke: #d5dfef; stroke-width: 2; }
      .lane-title { fill: #17406f; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill: #ffffff; stroke: #9cb7dc; stroke-width: 2; }
      .node-main { fill: #e9f2ff; stroke: #3267b9; }
      .node-sdk { fill: #eef8f3; stroke: #338765; }
      .node-output { fill: #fff6e6; stroke: #bf7a18; }
      .decision { fill: #f4f8ff; stroke: #3267b9; stroke-width: 2; }
      .text { fill: #17233a; font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #4c5f79; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #3267b9; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #6f86a8; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #17406f; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="980" rx="0"/>

  <rect class="lane" x="40" y="40" width="250" height="900" rx="10"/>
  <rect class="lane" x="320" y="40" width="330" height="900" rx="10"/>
  <rect class="lane" x="680" y="40" width="260" height="900" rx="10"/>
  <rect class="lane" x="970" y="40" width="270" height="900" rx="10"/>

  <text class="lane-title" x="64" y="78">1. 起動</text>
  <text class="lane-title" x="344" y="78">2. Agent実行の準備</text>
  <text class="lane-title" x="704" y="78">3. メッセージ処理</text>
  <text class="lane-title" x="994" y="78">4. 表示と保存</text>

  <rect class="node node-main" x="78" y="130" width="174" height="70" rx="8"/>
  <text class="text" x="132" y="162">main()</text>
  <text class="small" x="110" y="185">起動入口</text>

  <rect class="node node-main" x="66" y="250" width="198" height="82" rx="8"/>
  <text class="text" x="91" y="282">asyncio.run</text>
  <text class="small" x="83" y="307">run_agentを実行</text>

  <rect class="node node-main" x="390" y="128" width="190" height="74" rx="8"/>
  <text class="text" x="433" y="160">run_agent()</text>
  <text class="small" x="388" y="184">全体の司令塔</text>

  <rect class="node" x="360" y="250" width="250" height="78" rx="8"/>
  <text class="text" x="384" y="281">ClaudeAgentOptions</text>
  <text class="small" x="382" y="306">cwd / max_turns / 禁止ツール</text>

  <rect class="node" x="360" y="372" width="250" height="76" rx="8"/>
  <text class="text" x="421" y="404">build_prompt()</text>
  <text class="small" x="391" y="428">Agentへの依頼文を作る</text>

  <rect class="node node-output" x="360" y="494" width="250" height="76" rx="8"/>
  <text class="text" x="405" y="526">print_section()</text>
  <text class="small" x="383" y="550">Prompt / Agent output</text>

  <rect class="node node-sdk" x="710" y="132" width="200" height="78" rx="8"/>
  <text class="text" x="783" y="164">query()</text>
  <text class="small" x="724" y="188">SDKへ依頼しストリームを読む</text>

  <path class="decision" d="M 810 274 L 922 338 L 810 402 L 698 338 Z"/>
  <text class="text" x="744" y="334">messageの型は?</text>
  <text class="small" x="742" y="358">isinstanceで分岐</text>

  <rect class="node" x="700" y="472" width="220" height="82" rx="8"/>
  <text class="text" x="716" y="504">print_assistant</text>
  <text class="text" x="754" y="526">_message()</text>
  <text class="small" x="727" y="548">contentを1 blockずつ読む</text>

  <rect class="node" x="700" y="620" width="220" height="82" rx="8"/>
  <text class="text" x="723" y="652">print_result</text>
  <text class="text" x="761" y="674">_message()</text>
  <text class="small" x="731" y="696">subtype / resultを読む</text>

  <rect class="node node-output" x="1008" y="438" width="194" height="78" rx="8"/>
  <text class="text" x="1034" y="470">record_line()</text>
  <text class="small" x="1028" y="494">表示してリストに追加</text>

  <rect class="node node-output" x="1008" y="620" width="194" height="78" rx="8"/>
  <text class="text" x="1044" y="652">print_section()</text>
  <text class="small" x="1034" y="676">Result見出しを表示</text>

  <rect class="node node-output" x="390" y="792" width="190" height="78" rx="8"/>
  <text class="text" x="429" y="824">save_output()</text>
  <text class="small" x="405" y="848">outputsへ保存</text>

  <rect class="node node-output" x="1008" y="792" width="194" height="78" rx="8"/>
  <text class="text" x="1039" y="824">write_text()</text>
  <text class="small" x="1032" y="848">保存ファイルを書き出す</text>

  <path class="edge" d="M 165 200 L 165 246"/>
  <path class="edge" d="M 264 291 C 304 291, 330 165, 386 165"/>
  <path class="edge" d="M 485 202 L 485 246"/>
  <path class="edge" d="M 485 328 L 485 368"/>
  <path class="edge" d="M 485 448 L 485 490"/>
  <path class="edge" d="M 580 165 C 624 165, 658 171, 706 171"/>
  <path class="edge" d="M 810 210 L 810 270"/>
  <path class="edge" d="M 810 402 L 810 468"/>
  <path class="edge" d="M 880 381 C 948 420, 972 452, 1004 472"/>
  <path class="edge" d="M 920 513 C 956 504, 970 490, 1004 480"/>
  <path class="edge" d="M 810 554 L 810 616"/>
  <path class="edge" d="M 920 661 L 1004 661"/>
  <path class="edge-soft" d="M 1105 620 C 1105 580, 1105 552, 1105 520"/>
  <path class="edge" d="M 810 702 C 810 762, 640 831, 584 831"/>
  <path class="edge" d="M 485 570 L 485 788"/>
  <path class="edge" d="M 580 831 L 1004 831"/>
  <path class="edge-soft" d="M 1008 477 C 960 560, 940 132, 912 160"/>

  <text class="label" x="828" y="454">AssistantMessage</text>
  <text class="label" x="830" y="604">ResultMessage</text>
  <text class="label" x="924" y="432">本文やTool名</text>
  <text class="label" x="934" y="646">Done / message.result</text>
  <text class="label" x="422" y="766">ストリーム終了後</text>
  <text class="label" x="936" y="144">次のmessageへ</text>
</svg>
