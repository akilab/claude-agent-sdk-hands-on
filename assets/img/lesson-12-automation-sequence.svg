<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 12 業務向けミニ自動化のシーケンス図</title>
  <desc id="desc">mainからrun_agentを呼び、Skillファイル確認、サブエージェント定義、Options作成、query実行、サブエージェントレビュー、ResultMessageのstructured_output保存までを示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .lane-alt { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 1.4; }
      .head { fill: #0f2a44; }
      .head-text { fill: #ffffff; font: 700 20px Arial, sans-serif; }
      .text { fill: #0f172a; font: 16px Arial, sans-serif; }
      .small { fill: #475569; font: 14px Arial, sans-serif; }
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .step-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .step-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .step-amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .line { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .note { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="820"/>

  <rect class="head" x="40" y="34" width="1240" height="62" rx="10"/>
  <text class="head-text" x="66" y="73">Lesson 12: Skill + Subagent + Structured output + Log</text>
  <text class="head-text" x="808" y="73">FAQ公開前レビューの小さな完成形</text>

  <g>
    <rect class="lane" x="40" y="126" width="180" height="560" rx="10"/>
    <rect class="head" x="40" y="126" width="180" height="48" rx="10"/>
    <text class="head-text" x="80" y="157">main()</text>
    <line x1="130" y1="186" x2="130" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g>
    <rect class="lane-alt" x="238" y="126" width="190" height="560" rx="10"/>
    <rect class="head" x="238" y="126" width="190" height="48" rx="10"/>
    <text class="head-text" x="280" y="157">run_agent()</text>
    <line x1="333" y1="186" x2="333" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g>
    <rect class="lane" x="446" y="126" width="190" height="560" rx="10"/>
    <rect class="head" x="446" y="126" width="190" height="48" rx="10"/>
    <text class="head-text" x="482" y="157">Skill file</text>
    <line x1="541" y1="186" x2="541" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g>
    <rect class="lane" x="654" y="126" width="190" height="560" rx="10"/>
    <rect class="head" x="654" y="126" width="190" height="48" rx="10"/>
    <text class="head-text" x="680" y="157">Agent定義</text>
    <line x1="749" y1="186" x2="749" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g>
    <rect class="lane-alt" x="862" y="126" width="190" height="560" rx="10"/>
    <rect class="head" x="862" y="126" width="190" height="48" rx="10"/>
    <text class="head-text" x="906" y="157">query()</text>
    <line x1="957" y1="186" x2="957" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <g>
    <rect class="lane" x="1070" y="126" width="210" height="560" rx="10"/>
    <rect class="head" x="1070" y="126" width="210" height="48" rx="10"/>
    <text class="head-text" x="1100" y="157">Result / files</text>
    <line x1="1175" y1="186" x2="1175" y2="650" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <rect class="step-blue" x="74" y="210" width="112" height="42" rx="8"/>
  <text class="text" x="96" y="237">main</text>
  <path class="line" d="M 186 231 H 320"/>
  <text class="small" x="215" y="222">1. 起動</text>

  <rect class="step" x="270" y="278" width="126" height="54" rx="8"/>
  <text class="text" x="291" y="300">Skill確認</text>
  <text class="small" x="286" y="319">ensure_skill_file</text>
  <path class="line" d="M 396 305 H 528"/>
  <text class="small" x="420" y="296">2. 存在確認</text>

  <rect class="step-green" x="486" y="350" width="110" height="48" rx="8"/>
  <text class="text" x="505" y="379">SKILL.md</text>
  <path class="dash" d="M 541 398 C 590 436, 651 432, 738 396"/>
  <text class="small" x="565" y="438">3. サブエージェントへSkill内容を事前投入</text>

  <rect class="step" x="688" y="278" width="122" height="62" rx="8"/>
  <text class="text" x="700" y="302">AgentDefinition</text>
  <text class="small" x="691" y="322">skills=[faq-review]</text>
  <path class="line" d="M 396 314 C 496 248, 595 248, 688 301"/>
  <text class="small" x="470" y="250">build_agents()</text>

  <rect class="step-amber" x="688" y="456" width="122" height="64" rx="8"/>
  <text class="text" x="707" y="480">Options</text>
  <text class="small" x="692" y="500">Agent tool + schema</text>
  <path class="line" d="M 396 494 H 688"/>
  <text class="small" x="478" y="485">4. build_options()</text>

  <rect class="step-blue" x="900" y="456" width="114" height="64" rx="8"/>
  <text class="text" x="929" y="480">query</text>
  <text class="small" x="906" y="500">親Agent実行</text>
  <path class="line" d="M 810 488 H 900"/>
  <text class="small" x="825" y="478">5. 呼び出し</text>

  <rect class="step-green" x="894" y="558" width="126" height="58" rx="8"/>
  <text class="text" x="912" y="582">Agent tool</text>
  <text class="small" x="905" y="602">サブAgentへ依頼</text>
  <path class="dash" d="M 957 520 V 558"/>
  <path class="dash" d="M 1020 586 C 1084 640, 1128 636, 1170 598"/>
  <text class="small" x="982" y="650">6. レビュー結果を親Agentへ返す</text>

  <rect class="step" x="1108" y="420" width="134" height="54" rx="8"/>
  <text class="text" x="1121" y="444">ResultMessage</text>
  <text class="small" x="1116" y="464">structured_output</text>
  <path class="line" d="M 1014 488 H 1108"/>
  <text class="small" x="1030" y="478">7. 完了</text>

  <rect class="step-green" x="1108" y="520" width="134" height="64" rx="8"/>
  <text class="text" x="1148" y="544">保存</text>
  <text class="small" x="1128" y="564">review.json</text>
  <text class="small" x="1132" y="580">run_log.json</text>
  <path class="line" d="M 1175 474 V 520"/>
  <text class="small" x="1190" y="500">8. JSON保存</text>

  <rect class="note" x="64" y="716" width="1192" height="58" rx="10"/>
  <text class="text" x="88" y="742">読むポイント:</text>
  <text class="small" x="190" y="742">Optionsは実行主体ではありません。run_agent() が query() を呼び、親Agentが Agent tool でサブエージェントへ依頼します。</text>
  <text class="small" x="190" y="764">最終データは ResultMessage.structured_output から取り出し、業務で使いやすいJSONとして保存します。</text>
</svg>
