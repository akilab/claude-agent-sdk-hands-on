<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 21 resume latest session sequence</title>
  <desc id="desc">The script loads saved sessions from SQLite, selects the newest session, resumes it with ClaudeSDKClient, and appends user and assistant messages to the same session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1180" height="760" rx="28" fill="#f8fafc"/>
  <rect x="42" y="34" width="1096" height="690" rx="24" fill="#ffffff" stroke="#d8e2ee" filter="url(#shadow)"/>

  <text x="74" y="82" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Lesson 21: 最新セッションをresumeして会話を継続する</text>
  <text x="74" y="114" font-family="Arial, sans-serif" font-size="15" fill="#475569">複数セッションがあれば表示し、updated_atが最も新しいセッションを自動選択します。</text>

  <g font-family="Arial, sans-serif">
    <g>
      <rect x="74" y="154" width="174" height="54" rx="10" fill="#0f2f5f"/>
      <text x="161" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">学習者</text>
      <line x1="161" y1="208" x2="161" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
    <g>
      <rect x="290" y="154" width="174" height="54" rx="10" fill="#1d4ed8"/>
      <text x="377" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Lesson 21 script</text>
      <line x1="377" y1="208" x2="377" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
    <g>
      <rect x="506" y="154" width="174" height="54" rx="10" fill="#334155"/>
      <text x="593" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SQLite</text>
      <line x1="593" y1="208" x2="593" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
    <g>
      <rect x="722" y="154" width="174" height="54" rx="10" fill="#0369a1"/>
      <text x="809" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ClaudeSDKClient</text>
      <line x1="809" y1="208" x2="809" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
    <g>
      <rect x="938" y="154" width="146" height="54" rx="10" fill="#0f766e"/>
      <text x="1011" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Claude</text>
      <line x1="1011" y1="208" x2="1011" y2="670" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#0f172a">
    <line x1="171" y1="252" x2="363" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="267" y="241" text-anchor="middle">スクリプトを実行</text>

    <line x1="387" y1="306" x2="579" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="483" y="295" text-anchor="middle">sessionsを新しい順に取得</text>

    <line x1="579" y1="360" x2="387" y2="360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="483" y="349" text-anchor="middle">最新session_idを返す</text>

    <line x1="387" y1="414" x2="795" y2="414" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="591" y="403" text-anchor="middle">ClaudeAgentOptions(resume=session_id)</text>

    <line x1="819" y1="468" x2="997" y2="468" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="908" y="457" text-anchor="middle">続きの質問を送る</text>

    <line x1="997" y1="522" x2="819" y2="522" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="908" y="511" text-anchor="middle">AssistantMessage / ResultMessage</text>

    <line x1="387" y1="576" x2="579" y2="576" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="483" y="565" text-anchor="middle">user / assistantを追記</text>

    <line x1="387" y1="630" x2="579" y2="630" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="483" y="619" text-anchor="middle">updated_atを更新</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="78" y="672" width="428" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="292" y="695" text-anchor="middle" fill="#1e3a8a">次回実行時も、この更新済みセッションが最新として選ばれます</text>
    <rect x="552" y="672" width="514" height="36" rx="10" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="809" y="695" text-anchor="middle" fill="#115e59">Webフロントでは、この自動選択をユーザー選択UIに置き換えます</text>
  </g>
</svg>
